# Optional: run on Azure Kubernetes Service (AKS) instead of Container Apps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipstream
spec:
  replicas: 2
  selector: { matchLabels: { app: clipstream } }
  template:
    metadata: { labels: { app: clipstream } }
    spec:
      containers:
        - name: web
          image: <ACR_NAME>.azurecr.io/clipstream:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: clipstream-secrets } }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: clipstream }
spec:
  type: LoadBalancer
  selector: { app: clipstream }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: clipstream }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: clipstream }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
