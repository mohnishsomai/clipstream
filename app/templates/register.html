{% extends "base.html" %}
{% block title %}Sign up · ClipStream{% endblock %}
{% block content %}
<form class="panel" method="post">
  <h2>Create your account</h2>
  <label>Username <input name="username" required minlength="3"></label>
  <label>Email <input name="email" type="email" required></label>
  <label>Password <input name="password" type="password" required minlength="6"></label>
  <button class="btn wide">Sign up</button>
  <p class="small">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</form>
{% endblock %}
